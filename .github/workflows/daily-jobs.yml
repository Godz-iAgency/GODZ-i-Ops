name: Scheduled jobs

# Scheduled here so every background job uses the same GitHub Actions runner
# and Vercel deployments do not depend on plan-specific cron configuration.
on:
  schedule:
    - cron: "0 13 * * 1-5" # 08:00 Austin, weekdays - pipeline report
    - cron: "*/10 13-23 * * *" # every 10 min during the work day - reply alerts
    - cron: "30 12,18,0 * * *" # 07:30 / 13:30 / 19:30 Austin - inbox triage sweep, 3x/day
    - cron: "0 9 * * 0" # Sunday around 03:00-04:00 Austin - reviewed email cleanup
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        type: choice
        options: [daily-report, check-replies, triage-inbox, cleanup-email]

jobs:
  daily-report:
    if: github.event.schedule == '0 13 * * 1-5' || github.event.inputs.job == 'daily-report'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "${{ secrets.APP_URL }}/api/cron/daily-report" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  check-replies:
    if: github.event.schedule == '*/10 13-23 * * *' || github.event.inputs.job == 'check-replies'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "${{ secrets.APP_URL }}/api/cron/check-replies" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  triage-inbox:
    if: github.event.schedule == '30 12,18,0 * * *' || github.event.inputs.job == 'triage-inbox'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "${{ secrets.APP_URL }}/api/cron/triage-inbox?scope=recent" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  cleanup-email:
    if: github.event.schedule == '0 9 * * 0' || github.event.inputs.job == 'cleanup-email'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "${{ secrets.APP_URL }}/api/cron/cleanup-email" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
