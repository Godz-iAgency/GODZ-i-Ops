name: Scheduled jobs

# Runs here rather than in vercel.json because Vercel's Hobby plan allows only
# 2 cron jobs and no sub-daily frequency, which is too slow for reply alerts.
on:
  schedule:
    - cron: "0 13 * * 1-5" # 08:00 Austin, weekdays - pipeline report
    - cron: "*/10 13-23 * * *" # every 10 min during the work day - reply alerts
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        type: choice
        options: [daily-report, check-replies]

jobs:
  daily-report:
    if: github.event.schedule == '0 13 * * 1-5' || github.event.inputs.job == 'daily-report'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "${{ secrets.APP_URL }}/api/cron/daily-report" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  check-replies:
    if: github.event.schedule == '*/10 13-23 * * *' || github.event.inputs.job == 'check-replies'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "${{ secrets.APP_URL }}/api/cron/check-replies" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
