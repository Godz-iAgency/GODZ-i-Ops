name: Daily automation jobs

# All three daily jobs live here rather than in vercel.json because Vercel's
# Hobby plan allows only 2 cron jobs. GitHub Actions has no such cap.
on:
  schedule:
    - cron: "0 13 * * *" # 08:00 Austin (CDT) - pipeline report
    - cron: "0 14 * * *" # 09:00 Austin (CDT) - email outreach
    - cron: "0 15 * * *" # 10:00 Austin (CDT) - social posting
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        type: choice
        options: [daily-report, send-outreach, post-content]

jobs:
  daily-report:
    if: github.event.schedule == '0 13 * * *' || github.event.inputs.job == 'daily-report'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "${{ secrets.APP_URL }}/api/cron/daily-report" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  send-outreach:
    if: github.event.schedule == '0 14 * * *' || github.event.inputs.job == 'send-outreach'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "${{ secrets.APP_URL }}/api/cron/send-outreach" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  post-content:
    if: github.event.schedule == '0 15 * * *' || github.event.inputs.job == 'post-content'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "${{ secrets.APP_URL }}/api/cron/post-content" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
